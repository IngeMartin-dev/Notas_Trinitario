<div class="login-container" [class.fade-out]="isFadingOut()">
  <!-- Left side - Blue background with logo -->
  <div class="left-panel">
    <div class="logo-container">
      <img src="Logo Colegio.png" alt="Logo Colegio" class="school-logo">
      <h1>Notas Trinitario</h1>
      <p>Sistema de Gestión Académica</p>
    </div>
  </div>

  <!-- Right side - Login form -->
  <div class="right-panel">
    <div class="login-form-container">
      <div class="form-header">
        <h2>Iniciar Sesión</h2>
        <p>Ingresa tu correo y contraseña para acceder a la app</p>
      </div>

      <form class="login-form" (submit)="$event.preventDefault()">
        <div class="form-group">
          <label for="username">Usuario</label>
          <div class="input-group">
            <span class="material-icons input-icon">person</span>
               <input
               type="text"
               id="username"
               [ngModel]="username()"
               (ngModelChange)="username.set($event)"
               name="username"
               placeholder="Ingrese su usuario"
               autocomplete="username"
               required
               class="form-input">
            </div>
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <div class="input-group">
              <span class="material-icons input-icon">lock</span>
            <input
              [type]="passwordVisible() ? 'text' : 'password'"
              id="password"
              [ngModel]="password()"
              (ngModelChange)="password.set($event)"
              name="password"
              placeholder="Ingrese su contraseña"
              autocomplete="current-password"
              required
              class="form-input">
                <button
                  type="button"
                  class="password-toggle"
                  (click)="togglePasswordVisibility()"
                  [attr.title]="passwordVisible() ? 'Ocultar contraseña' : 'Mostrar contraseña'">
                  <span class="material-icons">
                    {{ passwordVisible() ? 'visibility_off' : 'visibility' }}
                  </span>
                </button>
              </div>
            </div>

            <button type="button" class="login-btn" [class.success]="buttonState() === 'success'" [class.error]="buttonState() === 'error'" [disabled]="isLoading()" (click)="onLogin(); $event.preventDefault()">
              @if (!isLoading()) {
                <span>{{ buttonText() }}</span>
              }
              @if (isLoading()) {
                <span class="loading-spinner"></span>
              }
            </button>
          </form>

          <div class="error-message" [class.visible]="errorVisible()" [class.hide]="errorHiding()">
            {{ errorMessage() }}
          </div>

          <div class="footer-text">
            <p>&copy; {{ currentYear }} Notas Trinitario</p>
          </div>
        </div>
      </div>
    </div>
