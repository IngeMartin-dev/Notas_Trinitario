# Perfil de PRODUCCION (Render + TiDB Cloud). Sin secretos: todo llega por variables de entorno.
# Se activa con SPRING_PROFILES_ACTIVE=prod (el Dockerfile ya lo deja puesto).
#
# Variables requeridas en Render:
#   SPRING_DATASOURCE_URL       jdbc:mysql://<host-tidb>:4000/<base>?sslMode=VERIFY_IDENTITY
#   SPRING_DATASOURCE_USERNAME  usuario de TiDB
#   SPRING_DATASOURCE_PASSWORD  contrasena de TiDB
#   APP_JWT_SECRET              cadena aleatoria larga (openssl rand -hex 64)
#   APP_SECURITY_ALLOWED_ORIGINS  https://<tu-proyecto>.pages.dev
# Opcionales: MAIL_USERNAME, MAIL_PASSWORD, MAIL_HOST, MAIL_PORT, MISTRAL_API_KEY

server.port=${PORT:8080}
server.forward-headers-strategy=framework

# --- Base de datos (TiDB es compatible con MySQL) ---
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
# TiDB Serverless corta conexiones inactivas: reciclarlas antes.
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# --- Archivos subidos ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# --- Correo (2FA y envio de boletines). Sin MAIL_* el backend arranca igual. ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:no-configurado@example.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Integraciones ---
# Push (Firebase) apagado por defecto: requiere el JSON de la cuenta de servicio.
app.firebase.enabled=${APP_FIREBASE_ENABLED:false}
app.ai.mistral-api-key=${MISTRAL_API_KEY:}
app.security.trust-proxy-headers=${APP_SECURITY_TRUST_PROXY_HEADERS:true}
