# Carpeta donde se guardan los boletines generados. Si se OMITE, se usa una
# ruta PORTÁTIL relativa a la ubicación de la app (al lado del JAR / raíz del
# proyecto), así funciona aunque se mueva la app a otra máquina o a un USB.
# Para fijarla en un lugar concreto, descomenta y pon una ruta absoluta:
# boletines.output-dir=C:/ruta/absoluta/Boletines Generados

# Ruta OPCIONAL al template del boletín. Si se define, tiene prioridad sobre
# la búsqueda automática y se usa tal cual. Si se OMITE, el backend busca
# la plantilla en estas ubicaciones (la primera que encuentre):
#   1) <app>/Frontend/Boletin Base/Boletin_Base.html   ← carpeta "definitiva"
#   2) <app>/Frontend/Boletin_Base.html                ← retro-compatibilidad
#   3) <app>/Boletin_Base.html                         ← retro-compatibilidad
# Esto funciona aunque la app esté en un USB o se mueva de máquina.
# Ejemplo para fijar una ruta absoluta:
# boletines.template-path=C:/ruta/absoluta/Boletin_Base.html
server.port=8080
spring.mvc.static-path-pattern=/**
spring.web.resources.static-locations=classpath:/static/,classpath:/META-INF/resources/static/
spring.web.resources.add-mappings=true
spring.web.resources.cache.period=0
logging.level.org.springframework.web=DEBUG
